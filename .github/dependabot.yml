version: 2

updates:
  # The repository currently has no third-party package-manager manifests.
  # Keep the pinned GitHub Actions workflow dependencies current and reviewable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
