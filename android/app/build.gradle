plugins { id 'com.android.application' }

android {
    namespace 'storm.engine.smoke'
    compileSdk 35

    defaultConfig {
        applicationId 'storm.engine.smoke'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DSTORM_BUILD_TESTS=OFF', '-DSTORM_BUILD_GLES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake { path '../../CMakeLists.txt' }
    }
}
