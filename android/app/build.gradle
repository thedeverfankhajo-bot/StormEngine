plugins { id 'com.android.application' }

android {
    namespace 'storm.engine.smoke'
    compileSdk 35

    defaultConfig {
        applicationId 'storm.engine.smoke'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake { cppFlags '-std=c++20' }
        }
    }

    externalNativeBuild {
        cmake { path '../../CMakeLists.txt' }
    }
}
