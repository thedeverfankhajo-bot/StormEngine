name: Foundation CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - g++
          - clang++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build -G Ninja
          -DSTORMENGINE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-sanitizers:
    name: Linux / Clang ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DSTORMENGINE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure

  static-analysis:
    name: Linux / Clang static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-tidy

      - name: Configure with clang-tidy
        env:
          CXX: clang++
        run: >-
          cmake -S . -B build-analysis -G Ninja
          -DSTORMENGINE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER="$CXX"
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build and run static analysis
        run: cmake --build build-analysis --parallel

  android-arm64:
    name: Android NDK / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Android NDK toolchain
        run: |
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_NDK_HOME/source.properties"
          test -f "$ANDROID_NDK_HOME/sources/android/native_app_glue/android_native_app_glue.c"
          grep -E '^Pkg.Revision[[:space:]]*=' "$ANDROID_NDK_HOME/source.properties"

      - name: Configure Android target libraries
        run: >-
          cmake -S . -B build-android-arm64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-21
          -DSTORMENGINE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Android target libraries and NativeActivity bridge
        run: >-
          cmake --build build-android-arm64
          --target storm_foundation storm_math storm_physics storm_core storm_serialization storm_platform storm_runtime storm_android_native_activity
          --parallel

      - name: Verify Android artifacts
        run: |
          test -s build-android-arm64/libstorm_foundation.a
          test -s build-android-arm64/libstorm_math.a
          test -s build-android-arm64/libstorm_physics.a
          test -s build-android-arm64/libstorm_core.a
          test -s build-android-arm64/libstorm_serialization.a
          test -s build-android-arm64/libstorm_platform.a
          test -s build-android-arm64/libstorm_runtime.a
          test -s build-android-arm64/libstorm_android_native_activity.so

  ios-arm64:
    name: iOS Device SDK / arm64
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify iOS Device SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Configure iOS device libraries
        run: >-
          cmake -S . -B build-ios-arm64 -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSTORMENGINE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build iOS device target libraries
        run: >-
          cmake --build build-ios-arm64 --config Release
          --target storm_foundation storm_math storm_physics storm_core storm_serialization storm_platform storm_runtime
          --parallel

      - name: Verify iOS artifacts
        run: |
          test -s build-ios-arm64/Release-iphoneos/libstorm_foundation.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_math.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_physics.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_core.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_serialization.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_platform.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_runtime.a

  macos:
    name: macOS / Apple Clang host tests
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTORMENGINE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
