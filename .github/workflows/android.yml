name: StormEngine Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stormengine-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.0'

      - name: Build Android debug APKs
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode=all

      - name: Verify generated APKs and native ABIs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' -print)
          test "${#apks[@]}" -gt 0
          printf '%s\n' "${apks[@]}"
          apk="${apks[0]}"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$apk" | grep -q "lib/$abi/libstorm_android_smoke.so"
          done

      - name: Run Android lint
        working-directory: android
        run: gradle lintDebug --no-daemon --stacktrace
