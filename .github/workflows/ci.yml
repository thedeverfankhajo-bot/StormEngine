name: StormEngine CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stormengine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure with host preset
        run: |
          cmake --list-presets
          cmake --preset host-debug

      - name: Build
        run: cmake --build --preset host-debug --parallel

      - name: Test
        run: ctest --preset host-debug

      - name: Run sandbox
        run: ./build/storm_sandbox

      - name: Package build artifacts
        run: |
          mkdir -p artifacts
          cp build/host-debug/storm_sandbox artifacts/
          find build/host-debug -maxdepth 1 -type f -name '*_tests' -exec cp {} artifacts/ \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stormengine-linux-debug
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure with release preset
        run: cmake --preset host-release
      - name: Build release
        run: cmake --build --preset host-release --parallel
      - name: Test release
        run: ctest --preset host-release
      - name: Run release sandbox
        run: ./build/host-release/storm_sandbox

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure with sanitizers
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DSTORM_BUILD_TESTS=ON -DSTORM_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure
