name: Foundation CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - g++
          - clang++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build -G Ninja
          -DSTORMENGINE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-sanitizers:
    name: Linux / Clang ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DSTORMENGINE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure

  static-analysis:
    name: Linux / Clang static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-tidy

      - name: Configure with clang-tidy
        env:
          CXX: clang++
        run: >-
          cmake -S . -B build-analysis -G Ninja
          -DSTORMENGINE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER="$CXX"
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build and run static analysis
        run: cmake --build build-analysis --parallel

  android-arm64:
    name: Android NDK / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Install Android application SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.0"

      - name: Install the pinned Android NDK
        env:
          ANDROID_NDK_VERSION: "28.2.13676358"
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"

          NDK_ROOT="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          if [ -f "$NDK_ROOT/source.properties" ] && \
             grep -Fqx "Pkg.Revision = $ANDROID_NDK_VERSION" "$NDK_ROOT/source.properties"; then
            echo "Using already-installed Android NDK $ANDROID_NDK_VERSION"
          else
            installed=false
            for attempt in 1 2 3; do
              if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$ANDROID_NDK_VERSION"; then
                installed=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "NDK installation attempt $attempt failed; retrying." >&2
                sleep 5
              fi
            done
            if [ "$installed" != true ]; then
              echo "Unable to install Android NDK $ANDROID_NDK_VERSION after 3 attempts." >&2
              exit 1
            fi
          fi

          test -f "$NDK_ROOT/build/cmake/android.toolchain.cmake"
          grep -Fqx "Pkg.Revision = $ANDROID_NDK_VERSION" "$NDK_ROOT/source.properties"
          test -f "$NDK_ROOT/sources/android/native_app_glue/android_native_app_glue.c"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Verify Android NDK toolchain
        run: |
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_NDK_HOME/source.properties"
          test -f "$ANDROID_NDK_HOME/sources/android/native_app_glue/android_native_app_glue.c"
          grep -Fqx "Pkg.Revision = $ANDROID_NDK_VERSION" "$ANDROID_NDK_HOME/source.properties"

      - name: Configure Android target libraries
        run: >-
          cmake -S . -B build-android-arm64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-21
          -DSTORMENGINE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Android target libraries and NativeActivity bridge
        run: >-
          cmake --build build-android-arm64
          --target storm_foundation storm_math storm_physics storm_physics2d storm_input storm_physics_scene1d storm_physics_scene2d storm_core storm_serialization storm_platform storm_runtime storm_android_native_activity
          --parallel

      - name: Verify Android artifacts
        run: |
          test -s build-android-arm64/libstorm_foundation.a
          test -s build-android-arm64/libstorm_math.a
          test -s build-android-arm64/libstorm_input.a
          test -s build-android-arm64/libstorm_physics.a
          test -s build-android-arm64/libstorm_physics2d.a
          test -s build-android-arm64/libstorm_physics_scene1d.a
          test -s build-android-arm64/libstorm_physics_scene2d.a
          test -s build-android-arm64/libstorm_core.a
          test -s build-android-arm64/libstorm_serialization.a
          test -s build-android-arm64/libstorm_platform.a
          test -s build-android-arm64/libstorm_runtime.a
          test -s build-android-arm64/libstorm_android_native_activity.so

      - name: Assemble Android arm64 debug APK
        run: gradle -p platforms/android :app:assembleDebug

      - name: Verify Android APK and native library packaging
        run: |
          test -s platforms/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l platforms/android/app/build/outputs/apk/debug/app-debug.apk | \
            grep -F "lib/arm64-v8a/libstorm_android_native_activity.so"

  ios-arm64:
    name: iOS Device SDK / arm64
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify iOS Device SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Configure iOS device libraries
        run: >-
          cmake -S . -B build-ios-arm64 -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DSTORMENGINE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build iOS device target libraries
        run: >-
          cmake --build build-ios-arm64 --config Release
          --target storm_foundation storm_math storm_physics storm_physics2d storm_input storm_physics_scene1d storm_physics_scene2d storm_core storm_serialization storm_platform storm_runtime storm_ios_app
          --parallel

      - name: Verify iOS artifacts
        run: |
          test -s build-ios-arm64/Release-iphoneos/libstorm_foundation.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_math.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_input.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_physics.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_physics2d.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_physics_scene1d.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_physics_scene2d.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_core.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_serialization.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_platform.a
          test -s build-ios-arm64/Release-iphoneos/libstorm_runtime.a
          test -d build-ios-arm64/Release-iphoneos/storm_ios_app.app

  macos:
    name: macOS / Apple Clang host tests
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTORMENGINE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
