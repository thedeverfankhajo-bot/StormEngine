name: StormEngine Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stormengine-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android debug APKs
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify generated APKs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' -print)
          test "${#apks[@]}" -gt 0
          printf '%s\n' "${apks[@]}"
          for apk in "${apks[@]}"; do
            echo "Inspecting $apk"
            unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/libstorm_android_smoke\.so$'
            for abi in arm64-v8a armeabi-v7a x86_64 x86; do
              unzip -l "$apk" | grep -q "lib/$abi/libstorm_android_smoke.so"
            done
          done

      - name: Android lint
        working-directory: android
        run: gradle lintDebug --no-daemon --stacktrace
