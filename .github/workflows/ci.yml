name: StormEngine CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stormengine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            ref="${line#*@}"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'Unpinned workflow action: %s\n' "$line" >&2
              bad=1
            fi
          done < <(grep -RhoE '^[[:space:]-]+uses:[[:space:]]*[^[:space:]]+' .github/workflows | sed -E 's/^[[:space:]-]+uses:[[:space:]]*//')
          test "$bad" -eq 0

  build-and-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug
      - name: Test
        run: ctest --preset host-debug
      - name: Run sandbox
        run: ./build/host-debug/storm_sandbox
      - name: Package build artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build/host-debug/storm_sandbox artifacts/
          find build/host-debug -maxdepth 1 -type f -name '*_tests' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -print -quit)"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stormengine-linux-debug
          path: artifacts/

  release-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake --preset host-release
      - name: Build
        run: cmake --build --preset host-release
      - name: Test
        run: ctest --preset host-release
      - name: Run sandbox
        run: ./build/host-release/storm_sandbox

  sanitizer:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure with sanitizers
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DSTORM_BUILD_TESTS=ON -DSTORM_ENABLE_SANITIZERS=ON -DSTORM_ENABLE_WARNINGS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure
      - name: Run sandbox
        run: ./build-sanitized/storm_sandbox
