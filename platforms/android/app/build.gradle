plugins {
    id "com.android.application"
}

android {
    namespace "com.stormengine.runtime"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.stormengine.runtime"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DSTORMENGINE_BUILD_TESTS=OFF"
                targets "storm_android_native_activity"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path rootProject.file("../../CMakeLists.txt")
            version "3.31.0"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
